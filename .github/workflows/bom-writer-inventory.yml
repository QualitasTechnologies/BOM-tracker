name: BOM client writer inventory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  writer-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:writer-inventory

  functions-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --include=dev
      - run: node --test functions/*.test.js functions/*.test.cjs

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci --prefix mcp-server --include=dev
      - run: npm --prefix mcp-server test
