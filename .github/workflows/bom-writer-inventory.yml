name: BOM client writer inventory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=1
      - run: npm run build

  writer-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:writer-inventory
      - name: Verify bounded legacy email enrichment
        run: node --test tests/enrichLegacyEmailIdentity.test.cjs
      - name: Verify confirmed project link operator tool (offline units)
        run: node --test tests/linkConfirmedPulseProjects.test.cjs

  functions-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions --include=dev
      - run: node --test functions/*.test.js functions/*.test.cjs

  mcp-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci --prefix mcp-server --include=dev
      - run: npm --prefix mcp-server test

  security-emulator-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The legacy permission regression loads the actual deployed rules revision.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/security/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix functions --include=dev
      - run: npm ci --prefix tests/security --ignore-scripts
      - run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-bom-native-security --config firebase.security-test.json --only "firestore,storage" "npm --prefix tests/security test"
      - name: Verify staged legacy purchasing rules
        run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-bom-native-security --config firebase.legacy-po-security-test.json --only firestore "node --test tests/security/purchaseOrderSentStatus.rules.test.mjs"
        env:
          FIRESTORE_RULES_PATH: firestore.legacy-po.rules
      - name: Verify additive content-free notice release
        run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-bom-native-security --config firebase.read-signals-security-test.json --only firestore "npm --prefix tests/security run test:read-signals-release"
        env:
          FIRESTORE_RULES_PATH: firestore.read-signals.rules
      - name: Verify staged overhead writer fence
        run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-bom-native-security --config firebase.overhead-security-test.json --only firestore "npm --prefix tests/security run test:overhead-fences"
        env:
          FIRESTORE_RULES_PATH: firestore.overhead-fence.rules
      - name: Verify staged schedule writer fence
        # Schedule fencing is independently checked against the exact live-policy baseline.
        run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-bom-native-security --config firebase.schedule-security-test.json --only firestore "npm --prefix tests/security run test:schedule-fences"
        env:
          FIRESTORE_RULES_PATH: firestore.schedule-fence.rules
      - name: Verify staged material ownership fence
        run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-bom-native-security --config firebase.material-security-test.json --only firestore "npm --prefix tests/security run test:material-fences"
        env:
          FIRESTORE_RULES_PATH: firestore.material-fence.rules
      - name: Verify member PO creation transactions
        run: npx --yes firebase-tools@14.9.0 emulators:exec --project demo-po-create-repair --config firebase.po-emulator.json --only firestore "node --test functions/legacyPOCreation.emulator.test.cjs"
