name: BOM client writer inventory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  writer-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:writer-inventory
